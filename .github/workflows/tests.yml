name: tests

# 解析まわりの回帰を機械で捕まえる。
#
# 置いた理由は実績があるからで、予防ではない。Date ヘッダのタイムゾーンを
# 取り違えたまま集計を出し、公開済みの記事に載せた表の結論（ピークの年）が
# あとから変わった。この種の欠陥は例外を投げず、合計が静かにずれるだけなので、
# 突き合わせる装置が無いと気づけない。
#
# 2つ回す。cli/tests（Python 単体）と、compare/（ブラウザ版と CLI 版の突き合わせ）。

on:
  push:
  pull_request:

# 読むだけで足りる。public リポジトリなので、既定に任せず明示しておく。
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 下限は check_environment.py が要求する 3.10、上限は現行。
        # 間を埋めていないのは、標準ライブラリしか使っていないため。
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 依存パッケージのインストールは無い。標準ライブラリのみで走る。
      # テスト側が TZ を Asia/Tokyo に固定して後片付けまでするので、
      # ランナーのタイムゾーンには依存しない。
      - name: テスト
        working-directory: cli
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee "${RUNNER_TEMP}/result.txt"

      # discover がテストを1件も拾えなくても unittest は成功で終わる。
      # そのとき「検査して通った緑」と「何も検査していない緑」は出力で区別が付かない。
      # 現在の21件を下限として置き、下回ったら落とす。
      # テストを増やす方向では触らなくてよい（増える側にしか動かないため）。
      - name: テストが実際に走ったことを確かめる
        run: |
          count=$(grep -c '\.\.\. ok$' "${RUNNER_TEMP}/result.txt" || true)
          echo "通ったテスト: ${count} 件"
          if [ "${count}" -lt 21 ]; then
            echo "::error::通ったテストが 21 件を下回った。テストが消えたか、まとめて skip された可能性がある"
            exit 1
          fi

  # 同じ解析ロジックを2つ持っている（index.html の JS と cli/ の Python）ので、
  # 同じメールを両方に流して1件ずつ突き合わせる。
  # 目視レビューでは差が見つからない領域で、欠陥は例外ではなく
  # 「もっともらしい別の値」として出るため。
  compare:
    runs-on: ubuntu-latest

    # ランナーの時計は UTC。そのままだと「日付を UTC に寄せる」欠陥を
    # 注入しても出力が変わらず、prove.py が見逃しとして落ちる。
    # 正しい実装と壊れた実装が同じ値を返すので、これは装置の穴ではなく
    # 「UTC の機械では、UTC に寄せる誤りを観測できない」という原理。
    # Python 側も Chrome 側も同じ環境変数を見るので、ここで揃える。
    # cli/tests が TZ を Asia/Tokyo に固定しているのと同じ理由。
    env:
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ubuntu-latest には Google Chrome が入っている。
      # 消えたときに、照合を回さないまま緑にならないよう先に確かめる。
      - name: Chrome があることを確かめる
        run: google-chrome --version

      # .eml はリポジトリに入っていない。実データの混入を防ぐため
      # .gitignore で *.eml を丸ごと弾いていて、フィクスチャも例外にしていないため。
      # 毎回生成するので、生成器を更新したのに古いフィクスチャで
      # 照合していた、という取りこぼしがそもそも起きない。
      - name: フィクスチャを生成する
        run: python compare/make_fixtures.py

      - name: ブラウザ版と CLI 版を突き合わせる
        run: python compare/compare.py

      # 「差分0件」は、一致したとも、何も検査していないとも読める。
      # 過去に実際にあった欠陥をブラウザ側に戻し、どれが差分に転ぶかを見る。
      # 1つも転ばない欠陥があれば、それは今の入力では検知できない穴なので落ちる。
      - name: 装置が生きていることを確かめる
        run: python compare/prove.py
